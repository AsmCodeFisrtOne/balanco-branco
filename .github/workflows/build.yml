name: build-apk
on:
  push:
    branches: [ app-medico ]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Inspecionar API da lib UVC (so leitura, nao afeta o APK)
        if: always()
        continue-on-error: true
        run: |
          echo "=== procurando AARs/JARs da herohan e serenegiant no cache ==="
          mkdir -p /tmp/apiinspect && cd /tmp/apiinspect
          find ~/.gradle /root/.gradle -name "*.aar" 2>/dev/null | grep -iE "uvc|herohan|libausbc" || true
          for aar in $(find ~/.gradle /root/.gradle -name "*.aar" 2>/dev/null | grep -iE "uvc|herohan"); do
            echo ">>> AAR $aar"; mkdir -p ext; (cd ext && unzip -o "$aar" classes.jar -d . >/dev/null 2>&1 && mv classes.jar "$(basename $aar).jar" 2>/dev/null) || true
          done
          find ~/.gradle /root/.gradle -name "*.jar" 2>/dev/null | grep -iE "uvc|herohan|serenegiant|libausbc|libuvc" | while read j; do cp "$j" ext/ 2>/dev/null || true; done
          echo "=== classes disponiveis ==="
          for j in ext/*.jar; do echo "--- $j ---"; unzip -l "$j" 2>/dev/null | grep -iE "ICameraHelper|CameraHelper|UVCParam|UVCCamera|/Size\.class|Format" || true; done
          echo "=== javap das classes-chave ==="
          CP=$(ls ext/*.jar 2>/dev/null | tr '\n' ':')
          for C in com.herohan.uvcapp.ICameraHelper com.herohan.uvcapp.CameraHelper com.herohan.uvcapp.UVCParam com.serenegiant.usb.UVCCamera com.serenegiant.usb.Size com.serenegiant.usb.Format; do
            echo "########## $C ##########"; javap -public -classpath "$CP" "$C" 2>&1 | grep -iE "PreviewSize|Size|Format|MJPEG|YUYV|FRAME_FORMAT|openCamera|UVCParam|public|field|width|height|type" | head -80 || echo "(nao encontrada)"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: apk, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: ignore }
      - name: Publicar Release com o APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-etapa1
          name: App do medico — Etapa 1 (teste da camera)
          body: APK de teste (Etapa 1). Instale no celular/tablet, ligue a camera USB por OTG e veja se a faixa de status mostra "Camera OK".
          files: app/build/outputs/apk/debug/*.apk
