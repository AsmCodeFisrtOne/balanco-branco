plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ferrari.vnfl'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.ferrarimedical.vnfl"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-etapa1"
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")   // chave fixa: todas as builds assinam igual -> atualiza por cima sem erro
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    // Captura UVC (Maven Central): le a camera USB direto pela USB Host API.
    implementation 'com.herohan:UVCAndroid:1.0.12'
    // Servidor HTTP local (so no 127.0.0.1): serve o sistema web + /fs + stream MJPEG da camera.
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
